name: Verify
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r bot/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/frontend.test.cjs
      - run: python -m collector.collect --fixture --output build/fixture --now 2026-10-13T05:00:00Z
      - run: python scripts/validate.py --root build/fixture
